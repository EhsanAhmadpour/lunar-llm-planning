# Models to test through OpenRouter.
#
# Ids and prices were checked on openrouter.ai on 14 Nov 2026. Prices change: check
# https://openrouter.ai/models before a new run. A wrong id is skipped (nothing is charged).
#
# Fields
#   id         OpenRouter model id, e.g. "vendor/model-name"
#   label      short folder-safe name used in results/ (letters, digits, - _ only)
#   tier       cheap | strong  (only used for grouping in the tables)
#   repeats    how many independent runs per problem
#   price_in   USD per 1 million input (prompt) tokens
#   price_out  USD per 1 million output (completion) tokens
#   max_tokens hard cap on the reply length INCLUDING thinking (also drives the worst-case cost)
#   reasoning  optional, passed to OpenRouter as-is. {enabled: false} = answer without thinking,
#              {effort: low|medium|high} = think first. Left out = the model's default.
#   provider   openrouter (default) | manual  (manual = run by hand, see README)
#
# Design: the same cheap models are run twice, WITHOUT thinking ("-direct": the model must write
# the plan straight away, as in the older papers) and WITH thinking ("-think"). The free pilot
# (pilot/README.md) showed that thinking models solve these missions easily, so the "-direct" runs
# are where most failures - and most of the verifier's benefit - are expected.
models:
  # ---- cheap, no thinking (3 repeats)
  - {id: "mistralai/mistral-nemo",        label: nemo-direct,     tier: cheap, repeats: 2, price_in: 0.20, price_out: 0.20, max_tokens: 4000}   # older small open model, cannot think; price is an upper bound (cheapest provider $0.017/$0.022)
  - {id: "deepseek/deepseek-v4.1-flash",  label: deepseek-direct, tier: cheap, repeats: 2, price_in: 0.45, price_out: 1.80, max_tokens: 4000, reasoning: {enabled: false}}   # price is the dearest provider; usually ~$0.05-0.15 / $0.20-0.60
  - {id: "anthropic/claude-haiku-5.5",    label: haiku-direct,    tier: cheap, repeats: 2, price_in: 0.10, price_out: 0.50, max_tokens: 4000, reasoning: {enabled: false}}
  - {id: "openai/gpt-5.6-luna",           label: gpt-direct,      tier: cheap, repeats: 2, price_in: 0.20, price_out: 1.20, max_tokens: 4000, reasoning: {enabled: false}}
  - {id: "google/gemini-3.5-flash-lite",  label: gemini-direct,   tier: cheap, repeats: 2, price_in: 0.30, price_out: 2.50, max_tokens: 4000, reasoning: {enabled: false}}
  # ---- cheap, with thinking (1 repeat)
  - {id: "deepseek/deepseek-v4.1-flash",  label: deepseek-think,  tier: cheap, repeats: 1, price_in: 0.45, price_out: 1.80, max_tokens: 32000, reasoning: {effort: medium}}
  - {id: "anthropic/claude-haiku-5.5",    label: haiku-think,     tier: cheap, repeats: 1, price_in: 0.10, price_out: 0.50, max_tokens: 32000, reasoning: {effort: medium}}
  - {id: "openai/gpt-5.6-luna",           label: gpt-think,       tier: cheap, repeats: 1, price_in: 0.20, price_out: 1.20, max_tokens: 32000, reasoning: {effort: medium}}
  - {id: "google/gemini-3.5-flash-lite",  label: gemini-think,    tier: cheap, repeats: 1, price_in: 0.30, price_out: 2.50, max_tokens: 32000, reasoning: {effort: medium}}
  # ---- older models named in the papers the report cites (none of them has a thinking mode)
  #      GPT-4 and GPT-3.5: Kambhampati et al. 2024, Silver et al. 2024. GPT-4o: the later PlanBench runs.
  #      Claude 3 Opus: the model quoted in Section 2 of the report (59.3% on Blocksworld).
  #      Prices are list prices seen on 15 Nov 2026 and still need a live check; GPT-4 has an 8k context.
  - {id: "openai/gpt-3.5-turbo",          label: gpt35-direct,    tier: paper, repeats: 2, price_in: 0.50, price_out: 1.50, max_tokens: 3000}
  - {id: "openai/gpt-4o",                 label: gpt4o-direct,    tier: paper, repeats: 1, price_in: 2.50, price_out: 10.00, max_tokens: 4000}
  - {id: "anthropic/claude-3-opus",       label: opus3-direct,    tier: paper, repeats: 1, price_in: 15.00, price_out: 75.00, max_tokens: 3000}
  - {id: "openai/gpt-4",                  label: gpt4-direct,     tier: paper, repeats: 1, price_in: 30.00, price_out: 60.00, max_tokens: 2000}
  # ---- strong models: not paid for. Claude Opus and Claude Haiku were run for free as sub-agents
  #      in the pilot (pilot/README.md); a paid Claude Sonnet would sit between those two.
  # A model that is not on OpenRouter can be run by hand:
  # - {id: "my-local-model", label: manual-a, tier: cheap, repeats: 1, price_in: 0, price_out: 0, max_tokens: 4000, provider: manual}
